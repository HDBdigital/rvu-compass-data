name: Update NCCI Edits

on:
  schedule:
    # Runs on the 5th of January, April, July, October at 09:00 UTC
    - cron: '0 9 5 1,4,7,10 *'
  workflow_dispatch: {}

jobs:
  update-ncci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas openpyxl

      - name: Run NCCI update script
        run: python scripts/update_ncci.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ncci_edits.csv ncci_manifest.json
          git diff --staged --quiet || git commit -m "Auto-update NCCI PTP edits"
          git push
